name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "27"

jobs:
  release:
    name: Build Release Assets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore deps cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-release-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Run standards-aligned quality gate
        run: mix q

      - name: Build docs
        run: mix docs

      - name: Build source archive
        run: git archive --format=tar.gz --output=jido_code-${{ github.ref_name }}.tar.gz HEAD

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: jido_code-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
